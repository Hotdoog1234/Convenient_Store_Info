<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a3a2a" />
    <meta name="description" content="Shield Environmental UST App — Kentucky Underground Storage Tank Database" />

    <!-- Security headers via meta (supplement server headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Enforce HTTPS: redirect http → https in production (not localhost) -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (
          window.location.protocol === 'http:' &&
          h !== 'localhost' &&
          h !== '127.0.0.1' &&
          h !== ''
        ) {
          window.location.replace(
            'https:' + window.location.href.slice(window.location.protocol.length)
          );
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Shield Environmental UST App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <style>
      @keyframes ilPulse {
        0%,100% { transform: scale(0.95); opacity: 0.85; }
        50%      { transform: scale(1.05); opacity: 1; }
      }
      @keyframes ilFade {
        0%,100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
    </style>
    <div id="initial-loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
      <img src="./shield-logo.jpg" alt="" style="width:250px;max-width:65vw;animation:ilPulse 1.5s ease-in-out infinite;" />
      <p style="margin-top:24px;font-size:14px;font-family:sans-serif;color:#1a4a2e;letter-spacing:0.05em;animation:ilFade 1.5s ease-in-out infinite;">Loading...</p>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
